<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auditory Posner Cueing Demo</title>

  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>

  <link href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: white;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    .small-text {
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.5;
      max-width: 900px;
      margin: auto;
      padding: 24px;
    }

    .display {
      position: relative;
      width: min(96vw, 1400px);
      height: min(55vh, 520px);
      margin: auto;
      border: none;
      background-color: #111;
    }

    .fixation {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1;
    }

    .target {
      position: absolute;
      width: 0;
      height: 0;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .left-target {
      left: 15%;
    }

    .right-target {
      left: 85%;
    }

    .triangle-up {
      border-left: clamp(24px, 3.5vw, 42px) solid transparent;
      border-right: clamp(24px, 3.5vw, 42px) solid transparent;
      border-bottom: clamp(42px, 6vw, 78px) solid white;
    }

    .triangle-down {
      border-left: clamp(24px, 3.5vw, 42px) solid transparent;
      border-right: clamp(24px, 3.5vw, 42px) solid transparent;
      border-top: clamp(42px, 6vw, 78px) solid white;
    }

    .results-card {
      max-width: 850px;
      margin: 30px auto;
      padding: 28px;
      border: 1px solid #444;
      border-radius: 12px;
      background-color: #1a1a1a;
      color: white;
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.5;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .result-box {
      border: 1px solid #555;
      border-radius: 10px;
      padding: 16px;
      background-color: #222;
    }

    .result-label {
      font-size: 0.85em;
      color: #bbb;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 1.5em;
      font-weight: bold;
    }

    .interpretation {
      margin-top: 20px;
      padding: 16px;
      border-left: 4px solid #f5d76e;
      background-color: #222;
    }

    .restart-button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 18px;
      border: 1px solid #f5d76e;
      border-radius: 8px;
      background-color: #111;
      color: white;
      cursor: pointer;
    }

    .restart-button:hover {
      background-color: #222;
    }

    .sound-button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 18px;
      border: 1px solid #f5d76e;
      border-radius: 8px;
      background-color: #111;
      color: white;
      cursor: pointer;
    }

    .sound-button:hover {
      background-color: #222;
    }
  </style>
</head>

<body></body>

<script>
  const jsPsych = initJsPsych({
    on_finish: function() {
      // Results are shown in the final trial.
      // Raw CSV data is not displayed automatically.
    }
  });

  const timeline = [];

  /*
    Timing constants
  */

  const FIXATION_MIN = 250;
  const FIXATION_MAX = 750;

  const AUDITORY_CUE_DURATION = 30;
  const POST_CUE_FIXATION = 70;
  const CTOA = AUDITORY_CUE_DURATION + POST_CUE_FIXATION;

  const TARGET_DURATION = 50;
  const RESPONSE_WINDOW_AFTER_TARGET = 1200;
  const ISI_DURATION = 500;

  /*
    Audio constants
  */

  const TONE_FREQUENCY = 600;
  const TONE_GAIN = 0.20;

  let audioContext = null;

  function initAudio() {
    if (audioContext === null) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }
  }

  function playTone(side, durationMs) {
    if (audioContext === null) {
      initAudio();
    }

    const now = audioContext.currentTime;
    const durationSec = durationMs / 1000;

    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(TONE_FREQUENCY, now);

    gainNode.gain.setValueAtTime(0.0001, now);
    gainNode.gain.exponentialRampToValueAtTime(TONE_GAIN, now + 0.005);
    gainNode.gain.setValueAtTime(TONE_GAIN, now + Math.max(durationSec - 0.005, 0.005));
    gainNode.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

    if (audioContext.createStereoPanner) {
      const panner = audioContext.createStereoPanner();

      if (side === "left") {
        panner.pan.setValueAtTime(-1, now);
      } else if (side === "right") {
        panner.pan.setValueAtTime(1, now);
      } else {
        panner.pan.setValueAtTime(0, now);
      }

      oscillator.connect(gainNode);
      gainNode.connect(panner);
      panner.connect(audioContext.destination);
    } else {
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
    }

    oscillator.start(now);
    oscillator.stop(now + durationSec + 0.01);
  }

  /*
    Fullscreen
  */

  const enterFullscreen = {
    type: jsPsychFullscreen,
    fullscreen_mode: true,
    message: `
      <div class="small-text">
        <h2>Auditory Posner Cueing Demonstration</h2>
        <p>This task will now enter fullscreen mode.</p>
        <p>Please wear headphones or use stereo speakers.</p>
        <p>Keep your hands near the <b>F</b> and <b>J</b> keys.</p>
      </div>
    `,
    button_label: "Enter fullscreen"
  };

  timeline.push(enterFullscreen);

  /*
    Instructions
  */

  const instructions = {
    type: jsPsychInstructions,
    pages: [
      `<div class="small-text">
        <h2>Instructions</h2>
        <p>Keep your eyes on the central fixation cross.</p>
        <p>You will hear a brief tone on the left or right. This tone is the spatial cue.</p>
        <p>A triangle will then appear very briefly on the left or right.</p>
        <p>Your task is to identify whether the triangle points <b>up</b> or <b>down</b>.</p>
        <p>Press <b>F</b> if the triangle points <b>up</b>.</p>
        <p>Press <b>J</b> if the triangle points <b>down</b>.</p>
        <p>The target appears for <b>50 ms</b>, then disappears.</p>
        <p>You then have <b>1200 ms</b> to respond while looking at fixation.</p>
        <p>The auditory cue is <b>non-predictive</b>: it is valid on 50% of trials and invalid on 50% of trials.</p>
      </div>`
    ],
    show_clickable_nav: true
  };

  timeline.push(instructions);

  /*
    Sound check.
    This is needed because browsers usually require a user action before audio can play.
  */

  const soundCheck = {
    type: jsPsychHtmlKeyboardResponse,
    choices: "NO_KEYS",
    stimulus: `
      <div class="small-text">
        <h2>Sound check</h2>
        <p>Click the button below to enable audio and hear a brief test tone.</p>
        <p>For the demonstration to work properly, use headphones or stereo speakers.</p>
        <button id="sound-check-button" class="sound-button">Play test tone and continue</button>
      </div>
    `,
    on_load: function() {
      const button = document.getElementById("sound-check-button");

      button.addEventListener("click", function() {
        initAudio();
        playTone("center", 120);

        setTimeout(function() {
          jsPsych.finishTrial({
            phase: "sound_check"
          });
        }, 250);
      });
    }
  };

  timeline.push(soundCheck);

  /*
    Utility functions
  */

  function randomInteger(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function safeRound(value) {
    if (value === null || value === undefined || Number.isNaN(value)) {
      return "NA";
    }
    return Math.round(value);
  }

  function safeFixed(value, digits = 1) {
    if (value === null || value === undefined || Number.isNaN(value)) {
      return "NA";
    }
    return value.toFixed(digits);
  }

  function makeDisplay(
    targetSide = null,
    targetOrientation = null,
    showFixation = true
  ) {
    let fixationHTML = "";

    if (showFixation) {
      fixationHTML = `<div class="fixation">+</div>`;
    }

    let targetHTML = "";

    if (targetSide !== null && targetOrientation !== null) {
      const targetLocationClass = targetSide === "left" ? "left-target" : "right-target";
      const orientationClass = targetOrientation === "up" ? "triangle-up" : "triangle-down";
      targetHTML = `<div class="target ${targetLocationClass} ${orientationClass}"></div>`;
    }

    return `
      <div class="display">
        ${fixationHTML}
        ${targetHTML}
      </div>
    `;
  }

  /*
    Trial creation
  */

  function createTrial(cueSide, targetSide, targetOrientation) {
    const validity = cueSide === targetSide ? "valid" : "invalid";
    const correctResponse = targetOrientation === "up" ? "f" : "j";
    const fixationDuration = randomInteger(FIXATION_MIN, FIXATION_MAX);

    return {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, null, true),
          choices: "NO_KEYS",
          trial_duration: fixationDuration,
          data: {
            phase: "fixation",
            fixation_duration: fixationDuration
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, null, true),
          choices: "NO_KEYS",
          trial_duration: AUDITORY_CUE_DURATION,
          on_start: function() {
            playTone(cueSide, AUDITORY_CUE_DURATION);
          },
          data: {
            phase: "auditory_cue",
            cue_side: cueSide,
            auditory_cue_duration: AUDITORY_CUE_DURATION,
            tone_frequency: TONE_FREQUENCY
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, null, true),
          choices: "NO_KEYS",
          trial_duration: POST_CUE_FIXATION,
          data: {
            phase: "post_cue_fixation",
            post_cue_fixation_duration: POST_CUE_FIXATION
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(targetSide, targetOrientation, true),
          choices: "NO_KEYS",
          trial_duration: TARGET_DURATION,
          data: {
            phase: "target_display",
            cue_side: cueSide,
            target_side: targetSide,
            target_orientation: targetOrientation,
            validity: validity,
            target_duration: TARGET_DURATION
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, null, true),
          choices: ["f", "j"],
          trial_duration: RESPONSE_WINDOW_AFTER_TARGET,
          response_ends_trial: true,
          data: {
            phase: "response",
            cue_modality: "auditory",
            cue_side: cueSide,
            target_side: targetSide,
            target_orientation: targetOrientation,
            validity: validity,
            fixation_duration: fixationDuration,
            auditory_cue_duration: AUDITORY_CUE_DURATION,
            tone_frequency: TONE_FREQUENCY,
            post_cue_fixation_duration: POST_CUE_FIXATION,
            ctoa: CTOA,
            target_duration: TARGET_DURATION,
            response_window_after_target: RESPONSE_WINDOW_AFTER_TARGET,
            correct_response: correctResponse
          },
          on_finish: function(data) {
            data.correct = jsPsych.pluginAPI.compareKeys(
              data.response,
              data.correct_response
            );

            data.responded = data.response !== null;

            if (data.rt !== null) {
              data.rt_from_target_offset = data.rt;
              data.rt_from_target_onset = data.rt + TARGET_DURATION;
            } else {
              data.rt_from_target_offset = null;
              data.rt_from_target_onset = null;
            }
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, null, false),
          choices: "NO_KEYS",
          trial_duration: ISI_DURATION,
          data: {
            phase: "isi",
            isi_duration: ISI_DURATION
          }
        }
      ]
    };
  }

  /*
    Balanced non-predictive trial structure.

    2 cue sides × 2 target sides × 2 orientations × 5 repetitions = 40 trials.

    Cue validity:
    - Valid: auditory cue and visual target on the same side.
    - Invalid: auditory cue and visual target on opposite sides.

    Because cue side and target side are fully crossed,
    the cue is valid on exactly 50% of trials.
  */

  const trials = [];

  const cueSides = ["left", "right"];
  const targetSides = ["left", "right"];
  const orientations = ["up", "down"];

  for (let rep = 0; rep < 5; rep++) {
    for (let cue of cueSides) {
      for (let target of targetSides) {
        for (let orientation of orientations) {
          trials.push(createTrial(cue, target, orientation));
        }
      }
    }
  }

  timeline.push({
    timeline: jsPsych.randomization.shuffle(trials)
  });

  /*
    Results screen
  */

  const summary = {
    type: jsPsychHtmlKeyboardResponse,
    choices: "NO_KEYS",
    stimulus: function() {
      const allResponseData = jsPsych.data.get().filter({phase: "response"});
      const correctData = allResponseData.filter({correct: true});

      const validRT = correctData.filter({validity: "valid"}).select("rt_from_target_onset").mean();
      const invalidRT = correctData.filter({validity: "invalid"}).select("rt_from_target_onset").mean();
      const cueingEffect = invalidRT - validRT;

      const totalTrials = allResponseData.count();
      const correctTrials = correctData.count();
      const missedTrials = allResponseData.filter({responded: false}).count();

      const accuracy = totalTrials > 0 ? (correctTrials / totalTrials) * 100 : NaN;

      const validTotal = allResponseData.filter({validity: "valid"}).count();
      const invalidTotal = allResponseData.filter({validity: "invalid"}).count();

      const validCorrect = allResponseData.filter({
        validity: "valid",
        correct: true
      }).count();

      const invalidCorrect = allResponseData.filter({
        validity: "invalid",
        correct: true
      }).count();

      const validAccuracy = validTotal > 0 ? (validCorrect / validTotal) * 100 : NaN;
      const invalidAccuracy = invalidTotal > 0 ? (invalidCorrect / invalidTotal) * 100 : NaN;

      let interpretation = "";

      if (!Number.isNaN(cueingEffect)) {
        if (cueingEffect > 0) {
          interpretation = `
            Your responses were slower on invalid trials than valid trials.
            This is the standard positive cueing effect.
          `;
        } else if (cueingEffect < 0) {
          interpretation = `
            Your responses were faster on invalid trials than valid trials.
            In a short online demonstration this can happen because there are few trials and timing is noisy.
          `;
        } else {
          interpretation = `
            Your valid and invalid reaction times were approximately equal.
            In a short demonstration, this may occur because there are few trials.
          `;
        }
      } else {
        interpretation = `
          There were not enough correct responses to calculate a reliable cueing effect.
        `;
      }

      return `
        <div class="results-card">
          <h2>Auditory Posner Results</h2>

          <p><b>Task:</b> identify whether the triangle pointed up or down.</p>
          <p><b>Cue:</b> brief lateralised auditory tone.</p>

          <div class="results-grid">
            <div class="result-box">
              <div class="result-label">Overall accuracy</div>
              <div class="result-value">${safeFixed(accuracy)}%</div>
            </div>

            <div class="result-box">
              <div class="result-label">Missed trials</div>
              <div class="result-value">${missedTrials}</div>
            </div>

            <div class="result-box">
              <div class="result-label">Valid RT</div>
              <div class="result-value">${safeRound(validRT)} ms</div>
            </div>

            <div class="result-box">
              <div class="result-label">Invalid RT</div>
              <div class="result-value">${safeRound(invalidRT)} ms</div>
            </div>

            <div class="result-box">
              <div class="result-label">Valid accuracy</div>
              <div class="result-value">${safeFixed(validAccuracy)}%</div>
            </div>

            <div class="result-box">
              <div class="result-label">Invalid accuracy</div>
              <div class="result-value">${safeFixed(invalidAccuracy)}%</div>
            </div>
          </div>

          <div class="result-box">
            <div class="result-label">Cueing effect</div>
            <div class="result-value">${safeRound(cueingEffect)} ms</div>
          </div>

          <div class="interpretation">
            <p><b>Interpretation:</b> ${interpretation}</p>
            <p>The cueing effect is calculated as <b>invalid RT − valid RT</b>.</p>
            <p>RT is calculated from target onset. Because responses are collected after target offset, 50 ms is added to the response-window RT.</p>
          </div>

          <p><b>Timing:</b> fixation jitter ${FIXATION_MIN}–${FIXATION_MAX} ms; auditory cue ${AUDITORY_CUE_DURATION} ms; post-cue fixation ${POST_CUE_FIXATION} ms; CTOA ${CTOA} ms; target ${TARGET_DURATION} ms; response window ${RESPONSE_WINDOW_AFTER_TARGET} ms; blank ISI ${ISI_DURATION} ms.</p>

          <button class="restart-button" onclick="location.reload()">Restart task</button>
        </div>
      `;
    }
  };

  timeline.push(summary);

  const exitFullscreen = {
    type: jsPsychFullscreen,
    fullscreen_mode: false
  };

  timeline.push(exitFullscreen);

  jsPsych.run(timeline);
</script>
</html>
