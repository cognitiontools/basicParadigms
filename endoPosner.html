<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Endogenous Posner Cueing Demo</title>

  <script src="https://unpkg.com/jspsych@8.2.1"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>

  <link href="https://unpkg.com/jspsych@8.2.1/css/jspsych.css" rel="stylesheet" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #111;
      color: white;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }

    .small-text {
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.5;
      max-width: 900px;
      margin: auto;
      padding: 24px;
    }

    .display {
      position: relative;
      width: min(96vw, 1400px);
      height: min(55vh, 520px);
      margin: auto;
      border: none;
      background-color: #111;
    }

    .fixation {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1;
    }

    .central-arrow {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(46px, 7vw, 82px);
      font-weight: bold;
      line-height: 1;
      color: #f5d76e;
    }

    .target {
      position: absolute;
      width: 0;
      height: 0;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .left-target {
      left: 15%;
    }

    .right-target {
      left: 85%;
    }

    .triangle-up {
      border-left: clamp(24px, 3.5vw, 42px) solid transparent;
      border-right: clamp(24px, 3.5vw, 42px) solid transparent;
      border-bottom: clamp(42px, 6vw, 78px) solid white;
    }

    .triangle-down {
      border-left: clamp(24px, 3.5vw, 42px) solid transparent;
      border-right: clamp(24px, 3.5vw, 42px) solid transparent;
      border-top: clamp(42px, 6vw, 78px) solid white;
    }

    .response-buttons {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 8vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(24px, 6vw, 80px);
      z-index: 1000;
    }

    .response-button {
      min-width: clamp(130px, 24vw, 240px);
      min-height: clamp(70px, 12vh, 120px);
      padding: 18px 28px;
      border: 2px solid #f5d76e;
      border-radius: 16px;
      background-color: #1a1a1a;
      color: white;
      font-size: clamp(24px, 5vw, 44px);
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .response-button:hover {
      background-color: #222;
    }

    .response-button:active {
      background-color: #333;
      transform: scale(0.98);
    }

    .response-label {
      margin-top: 10px;
      font-size: clamp(14px, 2vw, 18px);
      color: #bbb;
      font-weight: normal;
    }

    .results-card {
      max-width: 850px;
      margin: 30px auto;
      padding: 28px;
      border: 1px solid #444;
      border-radius: 12px;
      background-color: #1a1a1a;
      color: white;
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.5;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .result-box {
      border: 1px solid #555;
      border-radius: 10px;
      padding: 16px;
      background-color: #222;
    }

    .result-label {
      font-size: 0.85em;
      color: #bbb;
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 1.5em;
      font-weight: bold;
    }

    .interpretation {
      margin-top: 20px;
      padding: 16px;
      border-left: 4px solid #f5d76e;
      background-color: #222;
    }

    .restart-button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 18px;
      border: 1px solid #f5d76e;
      border-radius: 8px;
      background-color: #111;
      color: white;
      cursor: pointer;
    }

    .restart-button:hover {
      background-color: #222;
    }

    @media (max-width: 700px) {
      .display {
        height: min(50vh, 420px);
      }

      .results-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body></body>

<script>
  const jsPsych = initJsPsych({
    on_finish: function() {
      // Results are shown in the final screen.
      // Raw CSV data is not automatically displayed.
    }
  });

  const timeline = [];

  const FIXATION_MIN = 250;
  const FIXATION_MAX = 750;

  const CENTRAL_CUE_DURATION = 300;
  const POST_CUE_FIXATION = 200;
  const CTOA = CENTRAL_CUE_DURATION + POST_CUE_FIXATION;

  const TARGET_DURATION = 50;
  const RESPONSE_WINDOW_AFTER_TARGET = 1200;
  const ISI_DURATION = 500;

  const VALID_REPETITIONS = 16;
  const INVALID_REPETITIONS = 4;

  const enterFullscreen = {
    type: jsPsychFullscreen,
    fullscreen_mode: true,
    message: `
      <div class="small-text">
        <h2>Endogenous Posner Cueing Demonstration</h2>
        <p>This task will now enter fullscreen mode.</p>
        <p>Use the <b>F</b> and <b>J</b> keys on a keyboard, or use the on-screen buttons on a tablet.</p>
      </div>
    `,
    button_label: "Enter fullscreen"
  };

  timeline.push(enterFullscreen);

  const instructions = {
    type: jsPsychInstructions,
    pages: [
      `<div class="small-text">
        <h2>Instructions</h2>
        <p>Keep your eyes on the centre of the screen.</p>
        <p>A central arrow will point left or right. This arrow is the spatial cue.</p>
        <p>The arrow is <b>predictive</b>: it correctly predicts the target side on most trials.</p>
        <p>A triangle will then appear very briefly on the left or right.</p>
        <p>Your task is to identify whether the triangle points <b>up</b> or <b>down</b>.</p>
        <p>Keyboard: press <b>F</b> if the triangle points <b>up</b>.</p>
        <p>Keyboard: press <b>J</b> if the triangle points <b>down</b>.</p>
        <p>Tablet: tap the <b>Up</b> or <b>Down</b> button.</p>
        <p>The target appears for <b>50 ms</b>, then disappears.</p>
        <p>You then have <b>1200 ms</b> to respond while looking at fixation.</p>
        <p>Try to use the arrow cue, but respond to the triangle orientation, not its location.</p>
      </div>`
    ],
    show_clickable_nav: true
  };

  timeline.push(instructions);

  function randomInteger(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function safeRound(value) {
    if (value === null || value === undefined || Number.isNaN(value)) {
      return "NA";
    }
    return Math.round(value);
  }

  function safeFixed(value, digits = 1) {
    if (value === null || value === undefined || Number.isNaN(value)) {
      return "NA";
    }
    return value.toFixed(digits);
  }

  function oppositeSide(side) {
    return side === "left" ? "right" : "left";
  }

  function triggerKeyboardResponse(key) {
    const event = new KeyboardEvent("keydown", {
      key: key,
      code: key === "f" ? "KeyF" : "KeyJ",
      bubbles: true
    });

    document.dispatchEvent(event);
  }

  function makeDisplay(
    arrowSide = null,
    targetSide = null,
    targetOrientation = null,
    showFixation = true
  ) {
    let fixationHTML = "";

    if (showFixation) {
      fixationHTML = `<div class="fixation">+</div>`;
    }

    let arrowHTML = "";

    if (arrowSide !== null) {
      const arrowSymbol = arrowSide === "left" ? "←" : "→";
      arrowHTML = `<div class="central-arrow">${arrowSymbol}</div>`;
      fixationHTML = "";
    }

    let targetHTML = "";

    if (targetSide !== null && targetOrientation !== null) {
      const targetLocationClass = targetSide === "left" ? "left-target" : "right-target";
      const orientationClass = targetOrientation === "up" ? "triangle-up" : "triangle-down";
      targetHTML = `<div class="target ${targetLocationClass} ${orientationClass}"></div>`;
    }

    return `
      <div class="display">
        ${fixationHTML}
        ${arrowHTML}
        ${targetHTML}
      </div>
    `;
  }

  function makeResponseDisplay() {
    return `
      <div class="display">
        <div class="fixation">+</div>
      </div>

      <div class="response-buttons">
        <button class="response-button" onclick="triggerKeyboardResponse('f')">
          ▲
          <div class="response-label">Up / F</div>
        </button>

        <button class="response-button" onclick="triggerKeyboardResponse('j')">
          ▼
          <div class="response-label">Down / J</div>
        </button>
      </div>
    `;
  }

  function createTrial(cueSide, targetSide, targetOrientation) {
    const validity = cueSide === targetSide ? "valid" : "invalid";
    const correctResponse = targetOrientation === "up" ? "f" : "j";
    const fixationDuration = randomInteger(FIXATION_MIN, FIXATION_MAX);

    return {
      timeline: [
        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, null, null, true),
          choices: "NO_KEYS",
          trial_duration: fixationDuration,
          data: {
            phase: "fixation",
            fixation_duration: fixationDuration
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(cueSide, null, null, false),
          choices: "NO_KEYS",
          trial_duration: CENTRAL_CUE_DURATION,
          data: {
            phase: "central_arrow_cue",
            cue_modality: "visual_symbolic",
            cue_type: "central_arrow",
            cue_side: cueSide,
            central_cue_duration: CENTRAL_CUE_DURATION
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, null, null, true),
          choices: "NO_KEYS",
          trial_duration: POST_CUE_FIXATION,
          data: {
            phase: "post_cue_fixation",
            post_cue_fixation_duration: POST_CUE_FIXATION
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, targetSide, targetOrientation, true),
          choices: "NO_KEYS",
          trial_duration: TARGET_DURATION,
          data: {
            phase: "target_display",
            cue_side: cueSide,
            target_side: targetSide,
            target_orientation: targetOrientation,
            validity: validity,
            target_duration: TARGET_DURATION
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeResponseDisplay(),
          choices: ["f", "j"],
          trial_duration: RESPONSE_WINDOW_AFTER_TARGET,
          response_ends_trial: true,
          data: {
            phase: "response",
            task_type: "endogenous_posner",
            cue_modality: "visual_symbolic",
            cue_type: "central_arrow",
            cue_side: cueSide,
            target_side: targetSide,
            target_orientation: targetOrientation,
            validity: validity,
            fixation_duration: fixationDuration,
            central_cue_duration: CENTRAL_CUE_DURATION,
            post_cue_fixation_duration: POST_CUE_FIXATION,
            ctoa: CTOA,
            target_duration: TARGET_DURATION,
            response_window_after_target: RESPONSE_WINDOW_AFTER_TARGET,
            correct_response: correctResponse
          },
          on_finish: function(data) {
            data.correct = jsPsych.pluginAPI.compareKeys(
              data.response,
              data.correct_response
            );

            data.responded = data.response !== null;

            if (data.rt !== null) {
              data.rt_from_target_offset = data.rt;
              data.rt_from_target_onset = data.rt + TARGET_DURATION;
            } else {
              data.rt_from_target_offset = null;
              data.rt_from_target_onset = null;
            }

            if (data.response === "f") {
              data.response_label = "up";
            } else if (data.response === "j") {
              data.response_label = "down";
            } else {
              data.response_label = null;
            }
          }
        },

        {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: makeDisplay(null, null, null, false),
          choices: "NO_KEYS",
          trial_duration: ISI_DURATION,
          data: {
            phase: "isi",
            isi_duration: ISI_DURATION
          }
        }
      ]
    };
  }

  const trials = [];

  const cueSides = ["left", "right"];
  const orientations = ["up", "down"];

  for (let rep = 0; rep < VALID_REPETITIONS; rep++) {
    for (let cue of cueSides) {
      for (let orientation of orientations) {
        trials.push(
          createTrial(cue, cue, orientation)
        );
      }
    }
  }

  for (let rep = 0; rep < INVALID_REPETITIONS; rep++) {
    for (let cue of cueSides) {
      for (let orientation of orientations) {
        trials.push(
          createTrial(cue, oppositeSide(cue), orientation)
        );
      }
    }
  }

  timeline.push({
    timeline: jsPsych.randomization.shuffle(trials)
  });

  const summary = {
    type: jsPsychHtmlKeyboardResponse,
    choices: "NO_KEYS",
    stimulus: function() {
      const allResponseData = jsPsych.data.get().filter({phase: "response"});
      const correctData = allResponseData.filter({correct: true});

      const validRT = correctData.filter({validity: "valid"}).select("rt_from_target_onset").mean();
      const invalidRT = correctData.filter({validity: "invalid"}).select("rt_from_target_onset").mean();
      const cueingEffect = invalidRT - validRT;

      const totalTrials = allResponseData.count();
      const correctTrials = correctData.count();
      const missedTrials = allResponseData.filter({responded: false}).count();

      const accuracy = totalTrials > 0 ? (correctTrials / totalTrials) * 100 : NaN;

      const validTotal = allResponseData.filter({validity: "valid"}).count();
      const invalidTotal = allResponseData.filter({validity: "invalid"}).count();

      const validCorrect = allResponseData.filter({
        validity: "valid",
        correct: true
      }).count();

      const invalidCorrect = allResponseData.filter({
        validity: "invalid",
        correct: true
      }).count();

      const validAccuracy = validTotal > 0 ? (validCorrect / validTotal) * 100 : NaN;
      const invalidAccuracy = invalidTotal > 0 ? (invalidCorrect / invalidTotal) * 100 : NaN;

      let interpretation = "";

      if (!Number.isNaN(cueingEffect)) {
        if (cueingEffect > 0) {
          interpretation = `
            Your responses were slower on invalid trials than valid trials.
            This is the standard positive endogenous cueing effect.
          `;
        } else if (cueingEffect < 0) {
          interpretation = `
            Your responses were faster on invalid trials than valid trials.
            In a short online demonstration this can happen because there are few trials, timing is noisy, or the cue was not used consistently.
          `;
        } else {
          interpretation = `
            Your valid and invalid reaction times were approximately equal.
            In a short demonstration, this may occur because there are few trials or because the cue was not used consistently.
          `;
        }
      } else {
        interpretation = `
          There were not enough correct responses to calculate a reliable cueing effect.
        `;
      }

      return `
        <div class="results-card">
          <h2>Endogenous Posner Results</h2>

          <p><b>Task:</b> identify whether the triangle pointed up or down.</p>
          <p><b>Cue:</b> central arrow cue.</p>
          <p><b>Cue predictiveness:</b> 80% valid, 20% invalid.</p>

          <div class="results-grid">
            <div class="result-box">
              <div class="result-label">Overall accuracy</div>
              <div class="result-value">${safeFixed(accuracy)}%</div>
            </div>

            <div class="result-box">
              <div class="result-label">Missed trials</div>
              <div class="result-value">${missedTrials}</div>
            </div>

            <div class="result-box">
              <div class="result-label">Valid RT</div>
              <div class="result-value">${safeRound(validRT)} ms</div>
            </div>

            <div class="result-box">
              <div class="result-label">Invalid RT</div>
              <div class="result-value">${safeRound(invalidRT)} ms</div>
            </div>

            <div class="result-box">
              <div class="result-label">Valid accuracy</div>
              <div class="result-value">${safeFixed(validAccuracy)}%</div>
            </div>

            <div class="result-box">
              <div class="result-label">Invalid accuracy</div>
              <div class="result-value">${safeFixed(invalidAccuracy)}%</div>
            </div>
          </div>

          <div class="result-box">
            <div class="result-label">Cueing effect</div>
            <div class="result-value">${safeRound(cueingEffect)} ms</div>
          </div>

          <div class="interpretation">
            <p><b>Interpretation:</b> ${interpretation}</p>
            <p>The cueing effect is calculated as <b>invalid RT − valid RT</b>.</p>
            <p>RT is calculated from target onset. Because responses are collected after target offset, 50 ms is added to the response-window RT.</p>
          </div>

          <p><b>Timing:</b> fixation jitter ${FIXATION_MIN}–${FIXATION_MAX} ms; central arrow cue ${CENTRAL_CUE_DURATION} ms; post-cue fixation ${POST_CUE_FIXATION} ms; CTOA ${CTOA} ms; target ${TARGET_DURATION} ms; response window ${RESPONSE_WINDOW_AFTER_TARGET} ms; blank ISI ${ISI_DURATION} ms.</p>

          <button class="restart-button" onclick="location.reload()">Restart task</button>
        </div>
      `;
    }
  };

  timeline.push(summary);

  const exitFullscreen = {
    type: jsPsychFullscreen,
    fullscreen_mode: false
  };

  timeline.push(exitFullscreen);

  jsPsych.run(timeline);
</script>
</html>
